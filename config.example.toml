# Copy to config.toml and edit the destination. Keep personal chains in config.toml.
# Optional: [rclone] with config_file = ".secrets/rclone.conf"

[[chains]]
name = "example"
enabled = false
source = "dropbox:Camera Uploads"
destination = "/absolute/path/to/photos"
subdirectory = "phone/__raw__"
recursive = true
date_source = "capture"
