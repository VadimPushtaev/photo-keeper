# Copy to config.toml and set your remote and local paths.
# Optional: [rclone] with config_file = ".secrets/rclone.conf"

[[chains]]
name = "example"
enabled = false

[[chains.steps]]
type = "copy"
from = { rclone = "dropbox:Camera Uploads" }
to = "/absolute/path/to/photos/{year}/phone/__raw__"
delete_source = false

[[chains.steps]]
type = "sort"
from = "previous"
to = "/absolute/path/to/photos/{year}/phone/{month}"
delete_source = false

[chains.steps.routes]
video = "video"
png = "/absolute/path/to/photos/{year}/phone/screenshot"
jpeg_without_camera = "/absolute/path/to/photos/{year}/phone/pics"
