[project]
name = "photo-keeper"
version = "0.1.0"
description = "Configurable backup chains for photos and other media."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
photo-keeper = "photo_keeper.cli:main"

[tool.poetry]
packages = [{ include = "photo_keeper", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<10"
ruff = ">=0.15,<0.17"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"
